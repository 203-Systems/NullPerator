name: WASM workbench

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wasm.yml'
      - 'cmake/wasm/**'
      - 'docs/wasm/**'
      - 'sources/**'
      - 'tests/**'
      - 'tools/build-wasm.sh'
      - 'vercel.json'
      - 'web/**'
  pull_request:
    paths:
      - '.github/workflows/wasm.yml'
      - 'cmake/wasm/**'
      - 'docs/wasm/**'
      - 'sources/**'
      - 'tests/**'
      - 'tools/build-wasm.sh'
      - 'vercel.json'
      - 'web/**'

permissions:
  contents: read

env:
  EMSDK_VERSION: '6.0.5'
  NODE_VERSION: '24.19.0'
  PNPM_VERSION: '11.19.0'
  CMAKE_BUILD_PARALLEL_LEVEL: '1'

jobs:
  wasm:
    name: Host tests and static WASM acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure host adapter tests
        run: cmake -S tests -B build-host -DCMAKE_BUILD_TYPE=Release

      - name: Build host adapter tests serially
        run: cmake --build build-host --parallel 1

      - name: Run host adapter tests
        run: ctest --test-dir build-host --output-on-failure

      - name: Install pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install pinned Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build release WebAssembly serially
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          tools/build-wasm.sh Release

      - name: Install workbench dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run browser unit tests serially
        working-directory: web
        run: pnpm exec vitest run --pool=forks --maxWorkers=1 --fileParallelism=false

      - name: Install Chrome for Playwright
        working-directory: web
        run: pnpm exec playwright install --with-deps chrome

      - name: Run browser acceptance serially
        working-directory: web
        run: pnpm exec playwright test --workers=1 --grep-invert @visual

      - name: Build and verify static distribution
        working-directory: web
        run: |
          pnpm build
          pnpm verify:dist

      - name: Upload static workbench
        uses: actions/upload-artifact@v4
        with:
          name: picotracker-wasm-dist
          path: web/dist
          if-no-files-found: error

      - name: Link Vercel project
        if: github.event_name == 'push' && github.ref == 'refs/heads/nullperator-main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@59.11.2 link --yes --project nullperator-web --token "$VERCEL_TOKEN"

      - name: Build Vercel deployment output
        if: github.event_name == 'push' && github.ref == 'refs/heads/nullperator-main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@59.11.2 build --prod --token "$VERCEL_TOKEN"

      - name: Deploy production Web app
        if: github.event_name == 'push' && github.ref == 'refs/heads/nullperator-main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@59.11.2 deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picotracker-wasm-playwright-results
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
