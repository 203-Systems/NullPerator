plugins { id 'com.android.application' }
// Share the product version and release build with the iOS target.
def productVersion = (rootProject.file('../sources/ProductVersion.h').text =~ /Version\[\] = "([^"]+)"/)
if (!productVersion.find()) throw new GradleException('Missing product version')
def releaseBuilds = (rootProject.file('../ios/NullPeratorIOS.xcodeproj/project.pbxproj').text =~ /CURRENT_PROJECT_VERSION = (\d+);/).collect { it[1] }.unique()
if (releaseBuilds.size() != 1) throw new GradleException('iOS build numbers must agree')
android {
    namespace 'org.nullperator.app'
    compileSdk 35
    ndkVersion '28.0.13004108'
    defaultConfig {
        applicationId 'org.nullperator.app'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 26
        targetSdk 35
        versionCode releaseBuilds[0].toInteger()
        versionName productVersion.group(1)
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++23'; arguments '-DAndroid=true', '-DANDROID_STL=c++_shared' } }
    }
    externalNativeBuild { cmake { path '../../sources/CMakeLists.txt'; version '3.22.1' } }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDir layout.buildDirectory.dir('generated/webAssets') } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
tasks.register('packageWeb', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'bash', 'android/scripts/package-web.sh', layout.buildDirectory.dir('generated/webAssets').get().asFile.absolutePath
    inputs.dir rootProject.file('../web/src')
    inputs.dir rootProject.file('../web/public')
    inputs.file rootProject.file('../web/package.json')
    inputs.file rootProject.file('../web/pnpm-lock.yaml')
    inputs.file rootProject.file('../web/vite.config.js')
    inputs.file rootProject.file('app/src/main/native-bootstrap.js')
    inputs.file rootProject.file('scripts/package-web.sh')
    outputs.dir layout.buildDirectory.dir('generated/webAssets')
}
tasks.named('preBuild').configure { dependsOn 'packageWeb' }
